<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Brain Tumor FL{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
        }
        nav {
            background: #1a1d2e;
            border-bottom: 1px solid #2d3748;
            padding: 0 40px;
            display: flex;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 18px;
            font-weight: 700;
            color: #1D9E75;
            text-decoration: none;
            margin-right: 40px;
        }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            color: #a0aec0;
            text-decoration: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.15s;
        }
        .nav-links a:hover { background: #2d3748; color: #fff; }
        .nav-links a.active { background: #1D9E75; color: #fff; }
        main { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
        .card {
            background: #1a1d2e;
            border: 1px solid #2d3748;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 16px;
        }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.15s;
        }
        .btn-primary { background: #1D9E75; color: #fff; }
        .btn-primary:hover { background: #085041; }
        footer {
            text-align: center;
            padding: 20px;
            color: #4a5568;
            font-size: 13px;
            border-top: 1px solid #2d3748;
            margin-top: 60px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <a class="nav-brand" href="/">🧠 BrainTumor FL</a>
        <div class="nav-links">
            <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Predict</a>
            <a href="/results" {% if request.path == '/results' %}class="active"{% endif %}>Results</a>
            <a href="/about" {% if request.path == '/about' %}class="active"{% endif %}>About FL</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        Brain Tumor Detection using Federated Learning &nbsp;|&nbsp;
        ResNet-18 + FedAvg &nbsp;|&nbsp; 93.71% Accuracy &nbsp;|&nbsp;
        B.Tech CSE (AI/ML), DAVIET
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
